<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProxNet Dashboard</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <!-- Include D3.js and Socket.IO via CDN -->
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
</head>
<body>
    <div id="sidebar">
        <h1>🌐 ProxNet</h1>
        <p style="color:#8b949e; font-size: 14px;">AI-Powered Threat Visualizer</p>
        
        <div class="stat-box">
            <div class="stat-title">Active Devices</div>
            <div class="stat-value" id="device-count">0</div>
        </div>
        
        <div class="stat-box">
            <div class="stat-title">Threats Detected</div>
            <div class="stat-value danger" id="threat-count">0</div>
        </div>

        <div class="stat-box">
            <div class="stat-title">Last Scan</div>
            <div class="stat-value" id="last-scan" style="font-size: 16px; color:#58a6ff;">Never</div>
        </div>

        <button onclick="triggerScan()">⟳ Manual Scan</button>

        <h3 style="color: var(--primary); font-size: 14px; margin-top: 30px; border-bottom: 1px solid #333; padding-bottom: 5px;">Threat Feed</h3>
        <div id="threat-feed">
            <!-- Threats will be injected here -->
        </div>
    </div>

    <div id="graph-container">
        <!-- D3 Network Graph will be drawn here -->
        <div id="tooltip"></div>
    </div>

    <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
